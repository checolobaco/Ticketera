version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ticketera_db
    restart: always
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretPassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketera_backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-SecretPassword123}@postgres:5432/ticketdb
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      TICKET_SECRET: ${TICKET_SECRET:-your_ticket_secret}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./fronted
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.tudominio.com/api}
    container_name: ticketera_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
